version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/task_registry/tasks:/app/backend/task_registry/tasks
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0
    restart: unless-stopped
